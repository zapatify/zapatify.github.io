<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyager Zulu Time</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030508; overflow-x: hidden; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="vzt-clock-root"></div>
<script>
(function() {
  var e = React.createElement, useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;

  var VZT_EPOCH_UTC = Date.UTC(1977, 8, 5, 12, 56, 0);
  var SECONDS_PER_ARC = 8833536;
  var AU_PER_YEAR = 3.57;
  var VOYAGER_SPEED_KMS = 17.0;
  var KM_PER_AU = 149597870.7;

  function utcToVa(now) {
    return (now - VZT_EPOCH_UTC) / 1000 / SECONDS_PER_ARC;
  }

  function formatVa(va) {
    var intPart = Math.floor(va);
    var decStr = (va - intPart).toFixed(10).substring(1);
    return intPart + decStr;
  }

  function getUnitBreakdown(va) {
    var intPart = Math.floor(va);
    var decStr = (va - intPart).toFixed(10).substring(2);
    return [
      { label: "Arc", symbol: "Va", value: String(intPart), earthEquiv: "~102 days" },
      { label: "deci-arc", symbol: "dVa", value: decStr[0], earthEquiv: "~10.2 days" },
      { label: "centi-arc", symbol: "cVa", value: decStr[1], earthEquiv: "~1.02 days" },
      { label: "milli-arc", symbol: "mVa", value: decStr[2], earthEquiv: "~2.45 hours" },
      { label: "micro-arc", symbol: "\u03bcVa", value: decStr[3], earthEquiv: "~14.7 min" },
      { label: "nano-arc", symbol: "nVa", value: decStr[4], earthEquiv: "~1.47 min" },
      { label: "pico-arc", symbol: "pVa", value: decStr[5], earthEquiv: "~8.8 sec" },
      { label: "femto-arc", symbol: "fVa", value: decStr[6], earthEquiv: "~0.88 sec" },
    ];
  }

  function getDistanceAU(now) {
    return (now - VZT_EPOCH_UTC) / (1000 * 60 * 60 * 24 * 365.25) * AU_PER_YEAR;
  }

  function getLightTime(km) {
    var t = km / 299792.458;
    return { hours: Math.floor(t / 3600), minutes: Math.floor((t % 3600) / 60), seconds: Math.floor(t % 60) };
  }

  function formatNumber(num) {
    if (num >= 1e12) return (num / 1e12).toFixed(3) + " T";
    if (num >= 1e9) return (num / 1e9).toFixed(3) + " B";
    if (num >= 1e6) return (num / 1e6).toFixed(3) + " M";
    return num.toLocaleString("en-US", { maximumFractionDigits: 0 });
  }

  function Starfield() {
    var canvasRef = useRef(null);
    var starsRef = useRef([]);

    useEffect(function() {
      var canvas = canvasRef.current;
      var container = canvas.parentElement;
      var ctx = canvas.getContext("2d");
      var animId;

      function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      if (starsRef.current.length === 0) {
        for (var i = 0; i < 150; i++) {
          starsRef.current.push({
            x: Math.random(), y: Math.random(),
            r: Math.random() * 1.5 + 0.3,
            opacity: Math.random() * 0.6 + 0.2,
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            twinkleOffset: Math.random() * Math.PI * 2,
          });
        }
      }

      function draw(time) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        starsRef.current.forEach(function(s) {
          var flicker = 0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset);
          ctx.beginPath();
          ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(200,210,230," + (s.opacity * flicker) + ")";
          ctx.fill();
        });
        animId = requestAnimationFrame(draw);
      }
      animId = requestAnimationFrame(draw);

      return function() {
        cancelAnimationFrame(animId);
        window.removeEventListener("resize", resize);
      };
    }, []);

    return e("canvas", { ref: canvasRef, style: {
      position: "absolute", top: 0, left: 0, width: "100%", height: "100%", zIndex: 0, pointerEvents: "none"
    }});
  }

  function VZTClock() {
    var ref = useState(Date.now()), now = ref[0], setNow = ref[1];

    useEffect(function() {
      var interval = setInterval(function() { setNow(Date.now()); }, 88);
      return function() { clearInterval(interval); };
    }, []);

    var va = utcToVa(now);
    var vaFormatted = formatVa(va);
    var units = getUnitBreakdown(va);
    var distAU = getDistanceAU(now);
    var distKm = distAU * KM_PER_AU;
    var distMiles = distKm * 0.621371;
    var lightTime = getLightTime(distKm);
    var utcString = new Date(now).toISOString().replace("T", " ").substring(0, 19) + " UTC";
    var dotIndex = vaFormatted.indexOf(".");

    var mono = "'IBM Plex Mono', 'SF Mono', 'Fira Code', monospace";

    return e("div", { style: {
      background: "radial-gradient(ellipse at 30% 20%, #0a0e1a 0%, #030508 60%, #000000 100%)",
      color: "#c8d2dc", fontFamily: mono, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center", padding: "40px 20px",
      position: "relative", overflow: "hidden", minHeight: 600
    }},
      e(Starfield),
      e("div", { style: { position: "relative", zIndex: 1, width: "100%", maxWidth: 820 }},

        // Header
        e("div", { style: { textAlign: "center", marginBottom: 48 }},
          e("div", { style: { fontSize: 11, letterSpacing: 6, textTransform: "uppercase", color: "#4a6a8a", marginBottom: 8 }}, "Voyager Zulu Time"),
          e("div", { style: { fontSize: 13, letterSpacing: 3, color: "#2a4a6a", textTransform: "uppercase" }}, "Epoch: 1977-09-05 12:56:00 UTC")
        ),

        // Main Clock
        e("div", { style: {
          textAlign: "center", marginBottom: 48, padding: "40px 20px",
          border: "1px solid rgba(100,160,220,0.08)", borderRadius: 2,
          background: "rgba(6,12,24,0.6)", backdropFilter: "blur(4px)"
        }},
          e("div", { style: { fontFamily: mono, fontSize: "clamp(28px, 5vw, 52px)", fontWeight: 300, letterSpacing: 2, lineHeight: 1.2, color: "#e8f0f8", wordBreak: "break-all" }},
            e("span", { style: { color: "#7aacdc" }}, vaFormatted.substring(0, dotIndex)),
            e("span", { style: { color: "#3a5a7a" }}, "."),
            e("span", { style: { color: "#a0b8cc" }}, vaFormatted.substring(dotIndex + 1)),
            e("span", { style: { fontSize: "clamp(14px, 2.5vw, 22px)", color: "#3a6a9a", marginLeft: 8 }}, "Va")
          ),
          e("div", { style: { fontSize: 11, color: "#2a4a6a", marginTop: 12, letterSpacing: 2 }}, "VZT")
        ),

        // Unit Breakdown
        e("div", { style: {
          display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 1,
          marginBottom: 48, background: "rgba(100,160,220,0.04)",
          border: "1px solid rgba(100,160,220,0.06)", borderRadius: 2, overflow: "hidden"
        }},
          units.map(function(u, i) {
            return e("div", { key: i, style: {
              padding: "16px 14px", background: "rgba(6,12,24,0.7)",
              borderRight: i < units.length - 1 ? "1px solid rgba(100,160,220,0.04)" : "none"
            }},
              e("div", { style: { fontSize: 9, letterSpacing: 3, textTransform: "uppercase", color: "#3a5a7a", marginBottom: 6 }}, u.label),
              e("div", { style: { fontSize: 28, fontWeight: 300, color: i === 0 ? "#7aacdc" : "#a0b8cc", lineHeight: 1, marginBottom: 4 }}, u.value),
              e("div", { style: { fontSize: 9, color: "#2a4a6a" }}, u.symbol + " \u00b7 " + u.earthEquiv)
            );
          })
        ),

        // Voyager Status
        e("div", { style: {
          display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 1,
          marginBottom: 48, background: "rgba(100,160,220,0.04)",
          border: "1px solid rgba(100,160,220,0.06)", borderRadius: 2, overflow: "hidden"
        }},
          [
            { label: "Distance Traveled", value: distAU.toFixed(6) + " AU" },
            { label: "Distance (km)", value: formatNumber(distKm) + " km" },
            { label: "Distance (miles)", value: formatNumber(distMiles) + " mi" },
            { label: "Velocity", value: VOYAGER_SPEED_KMS.toFixed(1) + " km/s" },
            { label: "One-Way Light Time", value: lightTime.hours + "h " + lightTime.minutes + "m " + lightTime.seconds + "s" },
            { label: "Earth UTC", value: utcString },
          ].map(function(item, i) {
            return e("div", { key: i, style: { padding: "16px 14px", background: "rgba(6,12,24,0.7)" }},
              e("div", { style: { fontSize: 9, letterSpacing: 3, textTransform: "uppercase", color: "#3a5a7a", marginBottom: 6 }}, item.label),
              e("div", { style: { fontSize: 15, fontWeight: 400, color: "#a0b8cc", lineHeight: 1.3 }}, item.value)
            );
          })
        ),

        // Footer
        e("div", { style: { textAlign: "center", fontSize: 10, color: "#1a2a3a", letterSpacing: 2, lineHeight: 1.8 }},
          e("div", null, "VOYAGER 1 \u00b7 LAUNCHED 1977-09-05 \u00b7 CAPE CANAVERAL"),
          e("div", null, "LINEARIZED MODEL \u00b7 3.57 AU/YEAR \u00b7 1 ARC = 8,833,536 SECONDS")
        )
      )
    );
  }

  ReactDOM.render(React.createElement(VZTClock), document.getElementById("vzt-clock-root"));
})();
</script>
</body>
</html>
